<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Accordion Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="accordion-container">
        <details class="ease-accordion" open>
            <summary class="ease-accordion-header">
                <span>What is EaseMotion CSS?</span>
                <span class="ease-accordion-chevron">❯</span>
            </summary>
            <div class="ease-accordion-content">
                <p>An animation-first CSS framework with human-readable class names and zero external dependencies.</p>
            </div>
        </details>

        <details class="ease-accordion">
            <summary class="ease-accordion-header">
                <span>How do I use this component?</span>
                <span class="ease-accordion-chevron">❯</span>
            </summary>
            <div class="ease-accordion-content">
                <p>Simply wrap your content in native HTML5 <code>&lt;details&gt;</code> tags and apply the EaseMotion utility classes.</p>
            </div>
        </details>
    </div>

</body>
</html>
